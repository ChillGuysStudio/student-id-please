syntax = "proto3";

// Peer operations owned by Credential.
package student_id.credential.v1;

import "student_id/domain/v1/domain.proto";

option go_package = "github.com/ChillGuysStudio/student-id-please/gen/go/student_id/credential/v1;credentialv1";
option java_multiple_files = true;
option java_outer_classname = "CredentialProto";
option java_package = "com.chillguysstudio.studentid.credential.v1";

service CredentialService {
  // Delegated. Caller: moderation. Replaces
  // GET /internal/v1/cases/{case_id}/credential-results?session_id=.
  rpc GetCredentialResults(GetCredentialResultsRequest) returns (CredentialResults);
}

message GetCredentialResultsRequest {
  string case_id = 1;
  string session_id = 2;
}

message CredentialResults {
  string case_id = 1;
  repeated student_id.domain.v1.Credential credentials = 2;
  repeated student_id.domain.v1.Validation validations = 3;
}
