syntax = "proto3";

// Two-phase commit across service databases. The Message Broker coordinates.
// docs/contracts/transactions.md defines the flows, payloads, and outcomes.
package student_id.transactions.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/ChillGuysStudio/student-id-please/gen/go/student_id/transactions/v1;transactionsv1";
option java_multiple_files = true;
option java_outer_classname = "TransactionsProto";
option java_package = "com.chillguysstudio.studentid.transactions.v1";

// TransactionCoordinatorService is served by the Message Broker. Only a
// flow's initiator calls it, with its service credential.
service TransactionCoordinatorService {
  // Runs or joins one transaction and returns its decision.
  rpc RunTransaction(RunTransactionRequest) returns (RunTransactionResponse);
}

// One participant's part of a transaction.
message ParticipantRequest {
  // Participant registry name, for example player.
  string service = 1;
  // Operation name from the flow catalogue, for example award-shift.
  string operation = 2;
  // UTF-8 JSON object of the operation's payload schema.
  string payload_json = 3;
}

message RunTransactionRequest {
  // UUID chosen by the initiator. A repeated call with an equal request joins
  // the same transaction.
  string transaction_id = 1;
  // Flow name from the catalogue, for example end-shift.
  string flow = 2;
  // Exactly the flow's participants, in catalogue order.
  repeated ParticipantRequest participants = 3;
}

// The participant whose failure aborted the transaction.
message AbortCause {
  string service = 1;
  // rejected, busy, timeout, unavailable, or deadline.
  string kind = 2;
  // For rejected: the participant's ErrorDetail code and HTTP status.
  string code = 3;
  int32 http_status = 4;
}

message RunTransactionResponse {
  string transaction_id = 1;
  // committed or aborted.
  string outcome = 2;
  // True when every participant acknowledged phase two.
  bool completed = 3;
  // Set when outcome is aborted.
  AbortCause cause = 4;
}

// TransactionParticipantService is served by every participant: session and
// player. The Message Broker is the only caller.
service TransactionParticipantService {
  // Applies the operation and prepares it. A rejection is an error status
  // with an ErrorDetail whose http_status is 4xx.
  rpc Prepare(PrepareRequest) returns (PrepareResponse);
  // Commits a prepared operation. Repeating it after success returns OK.
  rpc Commit(CommitRequest) returns (CommitResponse);
  // Rolls back a prepared operation, or prevents a later one. Repeating it returns OK.
  rpc Abort(AbortRequest) returns (AbortResponse);
}

message PrepareRequest {
  string transaction_id = 1;
  string flow = 2;
  string operation = 3;
  string payload_json = 4;
  // The participant does not prepare after this instant.
  google.protobuf.Timestamp deadline = 5;
}

message PrepareResponse {
  string transaction_id = 1;
  // prepared, or read_only when the operation had already been applied and
  // nothing was prepared.
  string vote = 2;
}

message CommitRequest {
  string transaction_id = 1;
  string flow = 2;
  string operation = 3;
}

message CommitResponse {
  string transaction_id = 1;
}

message AbortRequest {
  string transaction_id = 1;
  string flow = 2;
  string operation = 3;
}

message AbortResponse {
  string transaction_id = 1;
}
