name: student-id-lab1
services:
  player-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: player_db
      POSTGRES_USER: player
      POSTGRES_PASSWORD: ${PLAYER_DB_PASSWORD:?Run python tools/configure_demo.py first}
    volumes:
      - player-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U player -d player_db']
      interval: 5s
      timeout: 3s
      retries: 20
  session-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: session_db
      POSTGRES_USER: session
      POSTGRES_PASSWORD: ${SESSION_DB_PASSWORD:?Run python tools/configure_demo.py first}
    volumes:
      - session-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U session -d session_db']
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: studentid
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Run python tools/configure_demo.py first}
    volumes:
      - broker-data:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  player:
    image: tirppy/student-id-player-service:${SERVICE_VERSION:-1.0.0-rc.2}
    environment:
      DATABASE_URL: postgresql+psycopg://player:${PLAYER_DB_PASSWORD}@player-db:5432/player_db
      JWT_PRIVATE_KEY_PATH: /app/data/player-private.pem
      SERVICE_TOKENS: '{"session":"${SESSION_SERVICE_TOKEN:?Generate configuration first}","moderation":"${MODERATION_SERVICE_TOKEN:?Generate configuration first}"}'
      RABBITMQ_URL: amqp://studentid:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    ports:
      - '127.0.0.1:8001:8001'
    volumes:
      - player-keys:/app/data
    depends_on:
      player-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
  session:
    image: tirppy/student-id-session-service:${SERVICE_VERSION:-1.0.0-rc.2}
    environment:
      DATABASE_URL: postgresql+psycopg://session:${SESSION_DB_PASSWORD}@session-db:5432/session_db
      PLAYER_URL: http://player:8001
      PLAYER_JWKS_URL: http://player:8001/.well-known/jwks.json
      PLAYER_MODE: http
      EXTERNAL_SERVICES_MODE: mock
      OUTGOING_SERVICE_TOKEN: ${SESSION_SERVICE_TOKEN}
      SERVICE_TOKENS: '{"moderation":"${MODERATION_SERVICE_TOKEN}"}'
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://studentid:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    ports:
      - '127.0.0.1:8002:8002'
    depends_on:
      session-db:
        condition: service_healthy
      player:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
volumes:
  player-data:
  session-data:
  broker-data:
  player-keys:
