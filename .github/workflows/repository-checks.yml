name: Repository checks

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false
      - name: Test policy, hooks, and service selection
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tests -v
      - name: Check documentation links and images
        run: python3 .github/scripts/check_docs.py
      - name: Check hook shell syntax
        run: sh -n .githooks/commit-msg .githooks/pre-push scripts/install-hooks.sh
