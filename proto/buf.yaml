# Canonical Student ID gRPC contracts. docs/contracts/grpc.md defines how
# repositories vendor this directory and generate code from it.
version: v2
modules:
  - path: .
deps:
  # google/api/annotations.proto for later grpc-gateway HTTP annotations.
  - buf.build/googleapis/googleapis
lint:
  use:
    - STANDARD
  except:
    # Responses mirror the existing JSON objects, which several RPCs share.
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
