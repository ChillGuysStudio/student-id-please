name: student-id-please
# Application logs use the json-file driver whatever the daemon default is, so
# Promtail can read them. The files rotate at 10 MB, keeping three.
x-logging: &json-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

# Without limits each JVM sizes its heap for the whole host. These flags fit a small service with two replicas on one
# laptop. MALLOC_ARENA_MAX bounds the native memory that glibc keeps for each thread.
x-java-memory: &java-memory
  JAVA_TOOL_OPTIONS: >-
    -XX:+UseSerialGC -Xms32m -Xmx128m -Xss512k -XX:+UseCompactObjectHeaders -XX:TieredStopAtLevel=1
  MALLOC_ARENA_MAX: '2'

# One node of a replicated PostgreSQL database. docs/contracts/replication.md defines the settings.
x-patroni: &patroni
  image: ghcr.io/zalando/spilo-17:4.0-p3
  entrypoint: [/usr/bin/dumb-init, /config/start.sh]
  healthcheck:
    test: [CMD, curl, -fsS, -o, /dev/null, 'http://127.0.0.1:8008/readiness']
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 30s
  depends_on:
    etcd:
      condition: service_healthy
  stop_grace_period: 30s
  restart: unless-stopped
x-patroni-environment: &patroni-environment
  PATRONI_ETCD3_HOSTS: etcd:2379
  PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
  PATRONI_RESTAPI_USERNAME: patroni
  PATRONI_RESTAPI_PASSWORD: ${PATRONI_REST_PASSWORD:?Set PATRONI_REST_PASSWORD in .env}
  PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
  PATRONI_SUPERUSER_USERNAME: postgres
  PATRONI_SUPERUSER_PASSWORD: ${PATRONI_SUPERUSER_PASSWORD:?Set PATRONI_SUPERUSER_PASSWORD in .env}
  PATRONI_REPLICATION_USERNAME: replicator
  PATRONI_REPLICATION_PASSWORD: ${PATRONI_STANDBY_PASSWORD:?Set PATRONI_STANDBY_PASSWORD in .env}

x-player-db: &player-db
  <<: *patroni
  environment:
    <<: *patroni-environment
    PATRONI_SCOPE: player
    APP_USER: player
    APP_DB: player_db
    APP_PASSWORD: ${PLAYER_DB_PASSWORD:?Set PLAYER_DB_PASSWORD in .env}
x-session-db: &session-db
  <<: *patroni
  environment:
    <<: *patroni-environment
    PATRONI_SCOPE: session
    APP_USER: session
    APP_DB: session_db
    APP_PASSWORD: ${SESSION_DB_PASSWORD:?Set SESSION_DB_PASSWORD in .env}
x-moderation-db: &moderation-db
  <<: *patroni
  environment:
    <<: *patroni-environment
    PATRONI_SCOPE: moderation
    APP_USER: moderation
    APP_DB: moderation
    APP_PASSWORD: ${MODERATION_DB_PASSWORD:?Set MODERATION_DB_PASSWORD in .env}
x-dms-db: &dms-db
  <<: *patroni
  environment:
    <<: *patroni-environment
    PATRONI_SCOPE: discord-dms
    APP_USER: discord_dms
    APP_DB: discord_dms
    APP_PASSWORD: ${DMS_DB_PASSWORD:?Set DMS_DB_PASSWORD in .env}
x-rules-db: &rules-db
  <<: *patroni
  environment:
    <<: *patroni-environment
    PATRONI_SCOPE: rules
    APP_USER: server_rules
    APP_DB: server_rules
    APP_PASSWORD: ${RULES_DB_PASSWORD:?Set RULES_DB_PASSWORD in .env}
x-registration: &registration
  DISCOVERY_GRPC_URL: http://discovery:50051
  CONTROL_PLANE_TOKENS: '{"discovery":"${DISCOVERY_CONTROL_TOKEN:?Set DISCOVERY_CONTROL_TOKEN in .env}","gateway":"${GATEWAY_CONTROL_TOKEN:?Set GATEWAY_CONTROL_TOKEN in .env}","operator":"${OPERATOR_CONTROL_TOKEN:?Set OPERATOR_CONTROL_TOKEN in .env}"}'
  CONTROL_MAX_CONCURRENT_CALLS: '8'
  DISCOVERY_REGISTER_INTERVAL_SECONDS: '5'
  OUTBOUND_TASK_TIMEOUT_SECONDS: '2'
  # Private metrics listener. Compose publishes no metrics port.
  METRICS_ADDRESS: ':9464'

services:
  gateway:
    image: ${GATEWAY_IMAGE:-maxnoragami/gateway-service:latest}
    logging: *json-logging
    env_file: .local/stack/gateway.env
    environment:
      <<: *registration
      SERVICE_NAME: gateway
      # The singleton advertises its health listener by service name. Status and log
      # export use its gRPC listener; business calls go through the Message Broker.
      INSTANCE_HTTP_URL: http://gateway:8083
      # Clients open chat on the DMs proxy, which balances the DMs replicas.
      GATEWAY_CHAT_WS_URL: ws://localhost:${DMS_PORT:-8009}
      CONTROL_PLANE_NAME: gateway
      CONTROL_PLANE_TOKEN: ${GATEWAY_CONTROL_TOKEN:?Set GATEWAY_CONTROL_TOKEN in .env}
    ports:
      - '127.0.0.1:${GATEWAY_PORT:-8080}:8080'
    volumes:
      - ./.local/stack/gateway-private.pem:/keys/gateway-private.pem:ro,z
      - ./.local/stack/player-public.pem:/keys/player-public.pem:ro,z
    healthcheck:
      test: [CMD, /gateway, --healthcheck]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  message-broker:
    image: ${BROKER_IMAGE:-maxnoragami/message-broker-service:latest}
    logging: *json-logging
    env_file: .local/stack/broker.env
    environment:
      <<: *registration
      SERVICE_NAME: message-broker
      # Callers match the Broker's registration grpc_url to their BROKER_GRPC_URL. Discovery
      # rejects two live instances with one address, so the Broker runs as one replica.
      INSTANCE_HTTP_URL: http://message-broker:8080
      CONTROL_PLANE_NAME: message-broker
      CONTROL_PLANE_TOKEN: ${MESSAGE_BROKER_CONTROL_TOKEN:?Set MESSAGE_BROKER_CONTROL_TOKEN in .env}
      BROKER_DATABASE_URL: postgres://broker:${BROKER_DB_PASSWORD:?Set BROKER_DB_PASSWORD in .env}@broker-db:5432/broker?sslmode=disable
    volumes:
      - ./.local/stack/broker-private.pem:/keys/broker-private.pem:ro,z
      - ./.local/stack/gateway-public.pem:/keys/gateway-public.pem:ro,z
    healthcheck:
      test: [CMD, wget, -qO-, 'http://127.0.0.1:8080/health']
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      broker-db:
        condition: service_healthy
    restart: unless-stopped
  broker-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: broker
      POSTGRES_USER: broker
      POSTGRES_PASSWORD: ${BROKER_DB_PASSWORD:?Set BROKER_DB_PASSWORD in .env}
    volumes:
      - broker-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U broker -d broker']
      interval: 5s
      timeout: 3s
      retries: 20
  discovery-state-init:
    # The Discovery image runs as 65532 and has no /state directory, so a fresh volume starts root-owned.
    image: busybox:1.37
    command: [chown, '65532:65532', /state]
    volumes:
      - discovery-state:/state
    restart: 'no'
  discovery:
    depends_on:
      discovery-state-init:
        condition: service_completed_successfully
    image: ${DISCOVERY_IMAGE:-maxnoragami/discovery-service:latest}
    logging: *json-logging
    environment:
      SERVICE_NAME: discovery
      DISCOVERY_ADDR: ':8081'
      METRICS_ADDRESS: ':9464'
      DISCOVERY_METRICS_PORT: '9464'
      DISCOVERY_METRICS_TARGET: discovery:9464
      DISCOVERY_HEALTH_INTERVAL_SECONDS: '1'
      DISCOVERY_LEASE_SECONDS: '15'
      DISCOVERY_STATE_FILE: /state/removed.json
      CONTROL_PLANE_NAME: discovery
      CONTROL_PLANE_TOKEN: ${DISCOVERY_CONTROL_TOKEN:?Set DISCOVERY_CONTROL_TOKEN in .env}
      CONTROL_PLANE_TOKENS: '{"gateway":"${GATEWAY_CONTROL_TOKEN:?Set GATEWAY_CONTROL_TOKEN in .env}","player":"${PLAYER_CONTROL_TOKEN:?Set PLAYER_CONTROL_TOKEN in .env}","session":"${SESSION_CONTROL_TOKEN:?Set SESSION_CONTROL_TOKEN in .env}","moderation":"${MODERATION_CONTROL_TOKEN:?Set MODERATION_CONTROL_TOKEN in .env}","discord-dms":"${DISCORD_DMS_CONTROL_TOKEN:?Set DISCORD_DMS_CONTROL_TOKEN in .env}","applicant":"${APPLICANT_CONTROL_TOKEN:?Set APPLICANT_CONTROL_TOKEN in .env}","credential":"${CREDENTIAL_CONTROL_TOKEN:?Set CREDENTIAL_CONTROL_TOKEN in .env}","rules":"${SERVER_RULES_CONTROL_TOKEN:?Set SERVER_RULES_CONTROL_TOKEN in .env}","university_record":"${UNIVERSITY_RECORD_CONTROL_TOKEN:?Set UNIVERSITY_RECORD_CONTROL_TOKEN in .env}","discovery":"${DISCOVERY_CONTROL_TOKEN:?Set DISCOVERY_CONTROL_TOKEN in .env}","message-broker":"${MESSAGE_BROKER_CONTROL_TOKEN:?Set MESSAGE_BROKER_CONTROL_TOKEN in .env}","prometheus":"${PROMETHEUS_CONTROL_TOKEN:?Set PROMETHEUS_CONTROL_TOKEN in .env}","operator":"${OPERATOR_CONTROL_TOKEN:?Set OPERATOR_CONTROL_TOKEN in .env}"}'
      CONTROL_MAX_CONCURRENT_CALLS: '8'
      OUTBOUND_TASK_TIMEOUT_SECONDS: '2'
      GATEWAY_ALLOW_INSECURE_WS: 'true'
      GATEWAY_ALLOW_LOCAL_WS: 'true'
      DISCORD_WEBHOOK_URL: ${DISCOVERY_DISCORD_WEBHOOK_URL:-}
    volumes:
      - discovery-state:/state
    healthcheck:
      test: [CMD, /discovery, --healthcheck]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
  etcd:
    # Holds the leader key of each replicated PostgreSQL database. It is reachable only on the container network.
    image: quay.io/coreos/etcd:v3.6.5
    command:
      - etcd
      - --data-dir=/data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --auto-compaction-retention=1
    volumes:
      - etcd-data:/data
    healthcheck:
      test: [CMD, etcdctl, endpoint, health]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  player-db-1:
    <<: *player-db
    hostname: player-db-1
    volumes:
      - ./config/patroni:/config:ro,z
      - player-data-1:/home/postgres/pgdata
  player-db-2:
    <<: *player-db
    hostname: player-db-2
    volumes:
      - ./config/patroni:/config:ro,z
      - player-data-2:/home/postgres/pgdata
  player-db-3:
    <<: *player-db
    hostname: player-db-3
    volumes:
      - ./config/patroni:/config:ro,z
      - player-data-3:/home/postgres/pgdata
  session-db-1:
    <<: *session-db
    hostname: session-db-1
    volumes:
      - ./config/patroni:/config:ro,z
      - session-data-1:/home/postgres/pgdata
  session-db-2:
    <<: *session-db
    hostname: session-db-2
    volumes:
      - ./config/patroni:/config:ro,z
      - session-data-2:/home/postgres/pgdata
  session-db-3:
    <<: *session-db
    hostname: session-db-3
    volumes:
      - ./config/patroni:/config:ro,z
      - session-data-3:/home/postgres/pgdata
  moderation-db-1:
    <<: *moderation-db
    hostname: moderation-db-1
    volumes:
      - ./config/patroni:/config:ro,z
      - moderation-data-1:/home/postgres/pgdata
  moderation-db-2:
    <<: *moderation-db
    hostname: moderation-db-2
    volumes:
      - ./config/patroni:/config:ro,z
      - moderation-data-2:/home/postgres/pgdata
  moderation-db-3:
    <<: *moderation-db
    hostname: moderation-db-3
    volumes:
      - ./config/patroni:/config:ro,z
      - moderation-data-3:/home/postgres/pgdata
  dms-db-1:
    <<: *dms-db
    hostname: dms-db-1
    volumes:
      - ./config/patroni:/config:ro,z
      - dms-data-1:/home/postgres/pgdata
  dms-db-2:
    <<: *dms-db
    hostname: dms-db-2
    volumes:
      - ./config/patroni:/config:ro,z
      - dms-data-2:/home/postgres/pgdata
  dms-db-3:
    <<: *dms-db
    hostname: dms-db-3
    volumes:
      - ./config/patroni:/config:ro,z
      - dms-data-3:/home/postgres/pgdata
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --requirepass, '${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: [CMD-SHELL, 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
  mongodb:
    # MongoDB 8.x refuses to start on Linux kernel 6.19+.
    image: mongo:7.0
    entrypoint:
      - bash
      - -c
      - |
        keyfile=/data/configdb/replica-set.key
        if [ ! -f "$$keyfile" ]; then
          openssl rand -base64 756 > "$$keyfile"
          chown mongodb:mongodb "$$keyfile"
          chmod 400 "$$keyfile"
        fi
        exec /usr/local/bin/docker-entrypoint.sh "$$@"
      - --
    command: [mongod, --replSet, rs0, --keyFile, /data/configdb/replica-set.key, --bind_ip_all, --wiredTigerCacheSizeGB, '0.25']
    environment:
      MONGO_INITDB_ROOT_USERNAME: case_services
      MONGO_INITDB_ROOT_PASSWORD: ${CASES_MONGO_PASSWORD:?Set CASES_MONGO_PASSWORD in .env}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1
          --username "$${MONGO_INITDB_ROOT_USERNAME}"
          --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin
          --eval '
          try { rs.status(); }
          catch (e) { if (e.codeName === "NotYetInitialized") { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongodb:27017"}]}); } else { throw e; } }
          if (!db.hello().isWritablePrimary) quit(1);'
      # Each probe starts mongosh, which needs about 270 MB, so a healthy server is probed less often.
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 3s
  player:
    deploy:
      replicas: 2
    image: ${PLAYER_IMAGE:-tirppy/student-id-player-service:latest}
    logging: *json-logging
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, '8001']
    env_file: .local/stack/player.env
    environment:
      <<: *registration
      SERVICE_NAME: player
      CONTROL_PLANE_NAME: player
      CONTROL_PLANE_TOKEN: ${PLAYER_CONTROL_TOKEN:?Set PLAYER_CONTROL_TOKEN in .env}
      DATABASE_URL: postgresql+psycopg://player:${PLAYER_DB_PASSWORD}@/player_db?host=player-db-1,player-db-2,player-db-3&port=5432,5432,5432
      JWT_PRIVATE_KEY_PATH: /keys/player-private.pem
    volumes:
      - ./.local/stack/player-private.pem:/keys/player-private.pem:ro,z
      - ./.local/stack/gateway-public.pem:/keys/gateway-public.pem:ro,z
      - ./.local/stack/broker-public.pem:/keys/broker-public.pem:ro,z
    depends_on:
      player-db-1:
        condition: service_healthy
      player-db-2:
        condition: service_healthy
      player-db-3:
        condition: service_healthy
    restart: unless-stopped
  session:
    deploy:
      replicas: 2
    image: ${SESSION_IMAGE:-tirppy/student-id-session-service:latest}
    logging: *json-logging
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, '8002']
    env_file: .local/stack/session.env
    environment:
      <<: *registration
      SERVICE_NAME: session
      CONTROL_PLANE_NAME: session
      CONTROL_PLANE_TOKEN: ${SESSION_CONTROL_TOKEN:?Set SESSION_CONTROL_TOKEN in .env}
      DATABASE_URL: postgresql+psycopg://session:${SESSION_DB_PASSWORD}@/session_db?host=session-db-1,session-db-2,session-db-3&port=5432,5432,5432
      BROKER_GRPC_URL: http://message-broker:50051
      BROKER_SERVICE_TOKEN: ${SESSION_SERVICE_TOKEN:?Set SESSION_SERVICE_TOKEN in .env}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - ./.local/stack/gateway-public.pem:/keys/gateway-public.pem:ro,z
      - ./.local/stack/broker-public.pem:/keys/broker-public.pem:ro,z
      - ./.local/stack/player-public.pem:/keys/player-public.pem:ro,z
    depends_on:
      session-db-1:
        condition: service_healthy
      session-db-2:
        condition: service_healthy
      session-db-3:
        condition: service_healthy
      player:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  moderation:
    deploy:
      replicas: 2
    image: ${MODERATION_IMAGE:-sentientmoss/pad-moderation-service:latest}
    logging: *json-logging
    env_file: .local/stack/moderation.env
    environment:
      <<: *registration
      SERVICE_NAME: moderation
      CONTROL_PLANE_NAME: moderation
      CONTROL_PLANE_TOKEN: ${MODERATION_CONTROL_TOKEN:?Set MODERATION_CONTROL_TOKEN in .env}
      DATABASE_URL: postgresql+psycopg://moderation:${MODERATION_DB_PASSWORD}@/moderation?host=moderation-db-1,moderation-db-2,moderation-db-3&port=5432,5432,5432
      BROKER_GRPC_URL: http://message-broker:50051
      BROKER_SERVICE_TOKEN: ${MODERATION_SERVICE_TOKEN:?Set MODERATION_SERVICE_TOKEN in .env}
    volumes:
      - ./.local/stack/gateway-public.pem:/keys/gateway-public.pem:ro,z
      - ./.local/stack/broker-public.pem:/keys/broker-public.pem:ro,z
      - moderation-publisher-logs:/var/log/student-id-publisher:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      moderation-db-1:
        condition: service_healthy
      moderation-db-2:
        condition: service_healthy
      moderation-db-3:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    restart: unless-stopped
  moderation-publisher:
    image: ${MODERATION_IMAGE:-sentientmoss/pad-moderation-service:latest}
    logging: *json-logging
    command: [python, -m, moderation.publisher]
    environment:
      DATABASE_URL: postgresql+psycopg://moderation:${MODERATION_DB_PASSWORD}@/moderation?host=moderation-db-1,moderation-db-2,moderation-db-3&port=5432,5432,5432
      BROKER_GRPC_URL: http://message-broker:50051
      BROKER_SERVICE_TOKEN: ${MODERATION_SERVICE_TOKEN:?Set MODERATION_SERVICE_TOKEN in .env}
    volumes:
      - moderation-publisher-logs:/var/log/student-id-publisher
    depends_on:
      moderation:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    restart: unless-stopped
  # DMs scales natively. Clients reach its WebSocket only through dms-proxy.
  discord-dms:
    deploy:
      replicas: 2
    image: ${DISCORD_DMS_IMAGE:-sentientmoss/pad-discord-dms-service:latest}
    logging: *json-logging
    env_file: .local/stack/discord-dms.env
    environment:
      <<: *registration
      SERVICE_NAME: discord-dms
      CONTROL_PLANE_NAME: discord-dms
      CONTROL_PLANE_TOKEN: ${DISCORD_DMS_CONTROL_TOKEN:?Set DISCORD_DMS_CONTROL_TOKEN in .env}
      DISCOVERY_LEASE_SECONDS: '15'
      DATABASE_URL: postgresql+asyncpg://discord_dms:${DMS_DB_PASSWORD}@/discord_dms?host=dms-db-1:5432&host=dms-db-2:5432&host=dms-db-3:5432
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CHAT_TICKET_SECRET: ${CHAT_TICKET_SECRET:?Set CHAT_TICKET_SECRET in .env}
      BROKER_GRPC_URL: http://message-broker:50051
      BROKER_SERVICE_TOKEN: ${DISCORD_DMS_SERVICE_TOKEN:?Set DISCORD_DMS_SERVICE_TOKEN in .env}
    volumes:
      - ./.local/stack/gateway-public.pem:/keys/gateway-public.pem:ro,z
      - ./.local/stack/broker-public.pem:/keys/broker-public.pem:ro,z
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      dms-db-1:
        condition: service_healthy
      dms-db-2:
        condition: service_healthy
      dms-db-3:
        condition: service_healthy
      redis:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    restart: unless-stopped
  dms-proxy:
    # Chat bypasses Gateway and the Broker, so this proxy balances the DMs WebSockets.
    image: caddy:2.8-alpine
    ports:
      - '127.0.0.1:${DMS_PORT:-8009}:8009'
    volumes:
      - ./config/dms-proxy.Caddyfile:/etc/caddy/Caddyfile:ro,z
    healthcheck:
      test: [CMD, wget, -qO-, 'http://127.0.0.1:8009/healthz']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      discord-dms:
        condition: service_healthy
    restart: unless-stopped
  applicant:
    deploy:
      replicas: 2
    image: ${APPLICANT_IMAGE:-mcittkmims/applicant-service:latest}
    logging: *json-logging
    env_file: .local/stack/applicant.env
    environment:
      <<: [*registration, *java-memory]
      SERVICE_NAME: applicant
      CONTROL_PLANE_NAME: applicant
      CONTROL_PLANE_TOKEN: ${APPLICANT_CONTROL_TOKEN:?Set APPLICANT_CONTROL_TOKEN in .env}
      SERVER_ADDRESS: 0.0.0.0
      MONGODB_URI: mongodb://case_services:${CASES_MONGO_PASSWORD}@mongodb:27017/applicant?authSource=admin&replicaSet=rs0&directConnection=true
    healthcheck:
      test: [CMD, bash, -c, 'exec 3<>/dev/tcp/127.0.0.1/8081 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
  credential:
    deploy:
      replicas: 2
    image: ${CREDENTIAL_IMAGE:-mcittkmims/credential-service:latest}
    logging: *json-logging
    env_file: .local/stack/credential.env
    environment:
      <<: [*registration, *java-memory]
      SERVICE_NAME: credential
      CONTROL_PLANE_NAME: credential
      CONTROL_PLANE_TOKEN: ${CREDENTIAL_CONTROL_TOKEN:?Set CREDENTIAL_CONTROL_TOKEN in .env}
      MONGODB_URI: mongodb://case_services:${CASES_MONGO_PASSWORD}@mongodb:27017/credential?authSource=admin&replicaSet=rs0&directConnection=true
    healthcheck:
      test: [CMD, bash, -c, 'exec 3<>/dev/tcp/127.0.0.1/8082 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
  university-mongodb:
    image: mongo:7.0
    restart: unless-stopped
    entrypoint:
      - bash
      - -c
      - |
        keyfile=/data/configdb/replica-set.key
        if [ ! -f "$$keyfile" ]; then
          openssl rand -base64 756 > "$$keyfile"
          chown mongodb:mongodb "$$keyfile"
          chmod 400 "$$keyfile"
        fi
        exec /usr/local/bin/docker-entrypoint.sh "$$@"
      - --
    command: [mongod, --replSet, rs0, --keyFile, /data/configdb/replica-set.key, --bind_ip_all, --wiredTigerCacheSizeGB, '0.25']
    environment:
      MONGO_INITDB_ROOT_USERNAME: university_record_service
      MONGO_INITDB_ROOT_PASSWORD: ${UNIVERSITY_MONGO_PASSWORD:?Set UNIVERSITY_MONGO_PASSWORD in .env}
    volumes:
      - university-mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1
          --username "$${MONGO_INITDB_ROOT_USERNAME}"
          --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin
          --eval 'try { quit(rs.status().ok === 1 ? 0 : 1) } catch (error) { quit(rs.initiate({_id:"rs0",members:[{_id:0,host:"university-mongodb:27017"}]}).ok === 1 ? 0 : 1) }'
      # Each probe starts mongosh, which needs about 270 MB, so a healthy server is probed less often.
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 3s
  university-record:
    deploy:
      replicas: 2
    image: ${UNIVERSITY_RECORD_IMAGE:-maxnoragami/university-record-service:latest}
    logging: *json-logging
    env_file: .local/stack/university_record.env
    environment:
      <<: [*registration, *java-memory]
      SERVICE_NAME: university_record
      CONTROL_PLANE_NAME: university_record
      CONTROL_PLANE_TOKEN: ${UNIVERSITY_RECORD_CONTROL_TOKEN:?Set UNIVERSITY_RECORD_CONTROL_TOKEN in .env}
      SPRING_PROFILES_ACTIVE: gateway
      MONGO_HOST: university-mongodb
      MONGO_DATABASE: university_records
      MONGO_ROOT_USERNAME: university_record_service
      MONGO_ROOT_PASSWORD: ${UNIVERSITY_MONGO_PASSWORD:?Set UNIVERSITY_MONGO_PASSWORD in .env}
      SERVER_PORT: 8006
      TASK_TIMEOUT: ${JAVA_TASK_TIMEOUT:-30s}
      MAX_CONCURRENT_TASKS: ${HTTP_MAX_CONCURRENT_TASKS:-100}
    volumes:
      - ./.local/stack/gateway-public.pem:/keys/gateway-public.pem:ro,z
      - ./.local/stack/broker-public.pem:/keys/broker-public.pem:ro,z
    healthcheck:
      test: [CMD, bash, -c, 'exec 3<>/dev/tcp/127.0.0.1/8006 && printf "GET /healthz HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      university-mongodb:
        condition: service_healthy
    restart: unless-stopped
  rules-db-1:
    <<: *rules-db
    hostname: rules-db-1
    volumes:
      - ./config/patroni:/config:ro,z
      - rules-data-1:/home/postgres/pgdata
  rules-db-2:
    <<: *rules-db
    hostname: rules-db-2
    volumes:
      - ./config/patroni:/config:ro,z
      - rules-data-2:/home/postgres/pgdata
  rules-db-3:
    <<: *rules-db
    hostname: rules-db-3
    volumes:
      - ./config/patroni:/config:ro,z
      - rules-data-3:/home/postgres/pgdata
  server-rules:
    deploy:
      replicas: 2
    image: ${SERVER_RULES_IMAGE:-maxnoragami/server-rules-service:latest}
    logging: *json-logging
    env_file: .local/stack/rules.env
    environment:
      <<: [*registration, *java-memory]
      SERVICE_NAME: rules
      CONTROL_PLANE_NAME: rules
      CONTROL_PLANE_TOKEN: ${SERVER_RULES_CONTROL_TOKEN:?Set SERVER_RULES_CONTROL_TOKEN in .env}
      SPRING_PROFILES_ACTIVE: gateway
      DATABASE_URL: jdbc:postgresql://rules-db-1:5432,rules-db-2:5432,rules-db-3:5432/server_rules?targetServerType=primary
      POSTGRES_USER: server_rules
      POSTGRES_PASSWORD: ${RULES_DB_PASSWORD:?Set RULES_DB_PASSWORD in .env}
      SERVER_PORT: 8005
      CURSOR_SECRET: ${RULES_CURSOR_SECRET:?Set RULES_CURSOR_SECRET in .env}
      TASK_TIMEOUT: ${JAVA_TASK_TIMEOUT:-30s}
      MAX_CONCURRENT_TASKS: ${HTTP_MAX_CONCURRENT_TASKS:-100}
    volumes:
      - ./.local/stack/gateway-public.pem:/keys/gateway-public.pem:ro,z
      - ./.local/stack/broker-public.pem:/keys/broker-public.pem:ro,z
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- "http://127.0.0.1:$${SERVER_PORT}/healthz" >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      rules-db-1:
        condition: service_healthy
      rules-db-2:
        condition: service_healthy
      rules-db-3:
        condition: service_healthy
    restart: unless-stopped
  prometheus:
    # Scrapes every replica that Discovery lists. It joins no registry and publishes only to localhost.
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - ./.local/stack/prometheus-control-token:/etc/prometheus/control-token:ro,z
      - prometheus-data:/prometheus
    healthcheck:
      test: [CMD, wget, -qO-, 'http://127.0.0.1:9090/-/healthy']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      discovery:
        condition: service_healthy
    restart: unless-stopped
  loki:
    # Stores service log records for 72 hours. It publishes no host port, because only Grafana and Promtail use it.
    image: grafana/loki:3.3.2
    command: [-config.file=/etc/loki/loki.yml]
    volumes:
      - ./config/loki/loki.yml:/etc/loki/loki.yml:ro,z
      - loki-data:/loki
    healthcheck:
      test: [CMD, wget, -qO-, 'http://127.0.0.1:3100/ready']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
  promtail:
    # Reads the Docker json-file logs of the stack, read-only. It never mounts the Docker socket.
    image: grafana/promtail:3.3.2
    command: [-config.file=/etc/promtail/promtail.yml]
    volumes:
      - ./config/promtail/promtail.yml:/etc/promtail/promtail.yml:ro,z
      - ${DOCKER_CONTAINERS_DIR:-/var/lib/docker/containers}:/var/lib/docker/containers:ro
      - promtail-positions:/positions
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped
  grafana:
    # Dashboards and the data source come from files, so every start provisions the same state.
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3000}:3000'
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro,z
    healthcheck:
      test: [CMD, wget, -qO-, 'http://127.0.0.1:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    restart: unless-stopped
  warehouse-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: ${WAREHOUSE_DB_PASSWORD:?Set WAREHOUSE_DB_PASSWORD in .env}
    volumes:
      - warehouse-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U warehouse -d warehouse']
      interval: 5s
      timeout: 3s
      retries: 20
  etl:
    # Reads each datastore as warehouse_reader, which scripts/warehouse_roles.py creates.
    image: ${ETL_IMAGE:-maxnoragami/etl-service:latest}
    logging: *json-logging
    environment:
      WAREHOUSE_DATABASE_URL: postgres://warehouse:${WAREHOUSE_DB_PASSWORD}@warehouse-db:5432/warehouse?sslmode=disable
      ETL_INTERVAL: ${ETL_INTERVAL:-5m}
      ETL_PLAYER_DATABASE_URL: postgres://warehouse_reader:${WAREHOUSE_READER_PASSWORD:?Set WAREHOUSE_READER_PASSWORD in .env}@player-db-1:5432,player-db-2:5432,player-db-3:5432/player_db?sslmode=disable&target_session_attrs=prefer-standby
      ETL_SESSION_DATABASE_URL: postgres://warehouse_reader:${WAREHOUSE_READER_PASSWORD}@session-db-1:5432,session-db-2:5432,session-db-3:5432/session_db?sslmode=disable&target_session_attrs=prefer-standby
      ETL_MODERATION_DATABASE_URL: postgres://warehouse_reader:${WAREHOUSE_READER_PASSWORD}@moderation-db-1:5432,moderation-db-2:5432,moderation-db-3:5432/moderation?sslmode=disable&target_session_attrs=prefer-standby
      ETL_DISCORD_DMS_DATABASE_URL: postgres://warehouse_reader:${WAREHOUSE_READER_PASSWORD}@dms-db-1:5432,dms-db-2:5432,dms-db-3:5432/discord_dms?sslmode=disable&target_session_attrs=prefer-standby
      ETL_RULES_DATABASE_URL: postgres://warehouse_reader:${WAREHOUSE_READER_PASSWORD}@rules-db-1:5432,rules-db-2:5432,rules-db-3:5432/server_rules?sslmode=disable&target_session_attrs=prefer-standby
      ETL_APPLICANT_URI: mongodb://warehouse_reader:${WAREHOUSE_READER_PASSWORD}@mongodb:27017/applicant?authSource=applicant&directConnection=true
      ETL_CREDENTIAL_URI: mongodb://warehouse_reader:${WAREHOUSE_READER_PASSWORD}@mongodb:27017/credential?authSource=credential&directConnection=true
      ETL_UNIVERSITY_RECORD_URI: mongodb://warehouse_reader:${WAREHOUSE_READER_PASSWORD}@university-mongodb:27017/university_records?authSource=university_records&directConnection=true
    depends_on:
      warehouse-db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  discovery-state:
  etcd-data:
  moderation-publisher-logs:
  player-data-1:
  player-data-2:
  player-data-3:
  session-data-1:
  session-data-2:
  session-data-3:
  moderation-data-1:
  moderation-data-2:
  moderation-data-3:
  dms-data-1:
  dms-data-2:
  dms-data-3:
  broker-db-data:
  mongo-data:
  university-mongo-data:
  rules-data-1:
  rules-data-2:
  rules-data-3:
  warehouse-data:
  prometheus-data:
  loki-data:
  promtail-positions:
