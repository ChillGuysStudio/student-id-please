syntax = "proto3";

// Peer operations owned by Player.
package student_id.player.v1;

option go_package = "github.com/ChillGuysStudio/student-id-please/gen/go/student_id/player/v1;playerv1";
option java_multiple_files = true;
option java_outer_classname = "PlayerProto";
option java_package = "com.chillguysstudio.studentid.player.v1";

service PlayerService {
  // Delegated. Callers: session, moderation.
  rpc GetPlayer(GetPlayerRequest) returns (Player);
  // Delegated. Callers: session. The actor must be a team member.
  rpc GetTeam(GetTeamRequest) returns (Team);
}

message GetPlayerRequest {
  string player_id = 1;
}

message Player {
  string player_id = 1;
  string username = 2;
  string display_name = 3;
  int32 xp = 4;
  int32 level = 5;
}

message GetTeamRequest {
  string team_id = 1;
}

message Team {
  string team_id = 1;
  string name = 2;
  string owner_id = 3;
  repeated string member_ids = 4;
}
