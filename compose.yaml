name: student-id-please
x-registration: &registration
  DISCOVERY_URL: ${DISCOVERY_URL:-http://discovery:8081}
  CONTROL_PLANE_TOKENS: '{"discovery":"${DISCOVERY_CONTROL_TOKEN:?Set DISCOVERY_CONTROL_TOKEN in .env}","gateway":"${GATEWAY_CONTROL_TOKEN:?Set GATEWAY_CONTROL_TOKEN in .env}","operator":"${OPERATOR_CONTROL_TOKEN:?Set OPERATOR_CONTROL_TOKEN in .env}"}'
  CONTROL_MAX_CONCURRENT_CALLS: '8'
  DISCOVERY_REGISTER_INTERVAL_SECONDS: '5'
  OUTBOUND_TASK_TIMEOUT_SECONDS: '2'

services:
  gateway:
    image: ${GATEWAY_IMAGE:-maxnoragami/gateway-service:latest}
    env_file: .local/stack/gateway.env
    environment:
      <<: *registration
      SERVICE_NAME: gateway
      # The singleton advertises its control listener by service name. It serves only
      # health, status, and log export; business calls go through the Message Broker.
      INSTANCE_HTTP_URL: http://gateway:8083
      CONTROL_PLANE_NAME: gateway
      CONTROL_PLANE_TOKEN: ${GATEWAY_CONTROL_TOKEN:?Set GATEWAY_CONTROL_TOKEN in .env}
    ports:
      - '127.0.0.1:${GATEWAY_PORT:-8080}:8080'
    volumes:
      - ./.local/stack/gateway-private.pem:/keys/gateway-private.pem:ro,z
      - ./.local/stack/player-public.pem:/keys/player-public.pem:ro,z
    healthcheck:
      test: [CMD, /gateway, --healthcheck]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  message-broker:
    image: ${BROKER_IMAGE:-maxnoragami/message-broker-service:latest}
    env_file: .local/stack/broker.env
    environment:
      <<: *registration
      SERVICE_NAME: message-broker
      # Callers match the Broker's registration to their configured BROKER_URL. Discovery
      # rejects two live instances with one http_url, so the Broker runs as one replica.
      INSTANCE_HTTP_URL: http://message-broker:8080
      CONTROL_PLANE_NAME: message-broker
      CONTROL_PLANE_TOKEN: ${MESSAGE_BROKER_CONTROL_TOKEN:?Set MESSAGE_BROKER_CONTROL_TOKEN in .env}
      BROKER_DATABASE_URL: postgres://broker:${BROKER_DB_PASSWORD:?Set BROKER_DB_PASSWORD in .env}@broker-db:5432/broker?sslmode=disable
    volumes:
      - ./.local/stack/broker-private.pem:/keys/broker-private.pem:ro,z
      - ./.local/stack/gateway-public.pem:/keys/gateway-public.pem:ro,z
    healthcheck:
      test: [CMD, wget, -qO-, 'http://127.0.0.1:8080/health']
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      broker-db:
        condition: service_healthy
    restart: unless-stopped
  broker-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: broker
      POSTGRES_USER: broker
      POSTGRES_PASSWORD: ${BROKER_DB_PASSWORD:?Set BROKER_DB_PASSWORD in .env}
    volumes:
      - broker-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U broker -d broker']
      interval: 5s
      timeout: 3s
      retries: 20
  discovery-state-init:
    # The Discovery image runs as 65532 and has no /state directory, so a fresh volume starts root-owned.
    image: busybox:1.37
    command: [chown, '65532:65532', /state]
    volumes:
      - discovery-state:/state
    restart: 'no'
  discovery:
    depends_on:
      discovery-state-init:
        condition: service_completed_successfully
    image: ${DISCOVERY_IMAGE:-maxnoragami/discovery-service:latest}
    environment:
      SERVICE_NAME: discovery
      DISCOVERY_ADDR: ':8081'
      DISCOVERY_HEALTH_INTERVAL_SECONDS: '1'
      DISCOVERY_LEASE_SECONDS: '15'
      DISCOVERY_STATE_FILE: /state/removed.json
      CONTROL_PLANE_NAME: discovery
      CONTROL_PLANE_TOKEN: ${DISCOVERY_CONTROL_TOKEN:?Set DISCOVERY_CONTROL_TOKEN in .env}
      CONTROL_PLANE_TOKENS: '{"gateway":"${GATEWAY_CONTROL_TOKEN:?Set GATEWAY_CONTROL_TOKEN in .env}","player":"${PLAYER_CONTROL_TOKEN:?Set PLAYER_CONTROL_TOKEN in .env}","session":"${SESSION_CONTROL_TOKEN:?Set SESSION_CONTROL_TOKEN in .env}","moderation":"${MODERATION_CONTROL_TOKEN:?Set MODERATION_CONTROL_TOKEN in .env}","discord-dms":"${DISCORD_DMS_CONTROL_TOKEN:?Set DISCORD_DMS_CONTROL_TOKEN in .env}","applicant":"${APPLICANT_CONTROL_TOKEN:?Set APPLICANT_CONTROL_TOKEN in .env}","credential":"${CREDENTIAL_CONTROL_TOKEN:?Set CREDENTIAL_CONTROL_TOKEN in .env}","rules":"${SERVER_RULES_CONTROL_TOKEN:?Set SERVER_RULES_CONTROL_TOKEN in .env}","university_record":"${UNIVERSITY_RECORD_CONTROL_TOKEN:?Set UNIVERSITY_RECORD_CONTROL_TOKEN in .env}","discovery":"${DISCOVERY_CONTROL_TOKEN:?Set DISCOVERY_CONTROL_TOKEN in .env}","message-broker":"${MESSAGE_BROKER_CONTROL_TOKEN:?Set MESSAGE_BROKER_CONTROL_TOKEN in .env}","operator":"${OPERATOR_CONTROL_TOKEN:?Set OPERATOR_CONTROL_TOKEN in .env}"}'
      CONTROL_MAX_CONCURRENT_CALLS: '8'
      OUTBOUND_TASK_TIMEOUT_SECONDS: '2'
      GATEWAY_ALLOW_INSECURE_WS: 'true'
      GATEWAY_ALLOW_LOCAL_WS: 'true'
      DISCORD_WEBHOOK_URL: ${DISCOVERY_DISCORD_WEBHOOK_URL:-}
    volumes:
      - discovery-state:/state
    healthcheck:
      test: [CMD, /discovery, --healthcheck]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
  player-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: player_db
      POSTGRES_USER: player
      POSTGRES_PASSWORD: ${PLAYER_DB_PASSWORD:?Set PLAYER_DB_PASSWORD in .env}
    volumes:
      - player-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U player -d player_db']
      interval: 5s
      timeout: 3s
      retries: 20
  session-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: session_db
      POSTGRES_USER: session
      POSTGRES_PASSWORD: ${SESSION_DB_PASSWORD:?Set SESSION_DB_PASSWORD in .env}
    volumes:
      - session-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U session -d session_db']
      interval: 5s
      timeout: 3s
      retries: 20
  moderation-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: moderation
      POSTGRES_USER: moderation
      POSTGRES_PASSWORD: ${MODERATION_DB_PASSWORD:?Set MODERATION_DB_PASSWORD in .env}
    volumes:
      - moderation-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U moderation -d moderation']
      interval: 5s
      timeout: 3s
      retries: 20
  dms-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: discord_dms
      POSTGRES_USER: discord_dms
      POSTGRES_PASSWORD: ${DMS_DB_PASSWORD:?Set DMS_DB_PASSWORD in .env}
    volumes:
      - dms-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U discord_dms -d discord_dms']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --requirepass, '${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: [CMD-SHELL, 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
  mongodb:
    # MongoDB 8.x refuses to start on Linux kernel 6.19+.
    image: mongo:7.0
    command: [mongod, --replSet, rs0, --bind_ip_all]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval '
          try { rs.status(); }
          catch (e) { if (e.codeName === "NotYetInitialized") { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongodb:27017"}]}); } else { throw e; } }
          if (!db.hello().isWritablePrimary) quit(1);'
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s
  player:
    deploy:
      replicas: 2
    image: ${PLAYER_IMAGE:-tirppy/student-id-player-service:latest}
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, '8001']
    env_file: .local/stack/player.env
    environment:
      <<: *registration
      SERVICE_NAME: player
      CONTROL_PLANE_NAME: player
      CONTROL_PLANE_TOKEN: ${PLAYER_CONTROL_TOKEN:?Set PLAYER_CONTROL_TOKEN in .env}
      DATABASE_URL: postgresql+psycopg://player:${PLAYER_DB_PASSWORD}@player-db:5432/player_db
      JWT_PRIVATE_KEY_PATH: /keys/player-private.pem
    volumes:
      - ./.local/stack/player-private.pem:/keys/player-private.pem:ro,z
      - ./.local/stack/gateway-public.pem:/keys/gateway-public.pem:ro,z
      - ./.local/stack/broker-public.pem:/keys/broker-public.pem:ro,z
    depends_on:
      player-db:
        condition: service_healthy
    restart: unless-stopped
  session:
    deploy:
      replicas: 2
    image: ${SESSION_IMAGE:-tirppy/student-id-session-service:latest}
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, '8002']
    env_file: .local/stack/session.env
    environment:
      <<: *registration
      SERVICE_NAME: session
      CONTROL_PLANE_NAME: session
      CONTROL_PLANE_TOKEN: ${SESSION_CONTROL_TOKEN:?Set SESSION_CONTROL_TOKEN in .env}
      DATABASE_URL: postgresql+psycopg://session:${SESSION_DB_PASSWORD}@session-db:5432/session_db
      BROKER_URL: http://message-broker:8080
      BROKER_SERVICE_TOKEN: ${SESSION_SERVICE_TOKEN:?Set SESSION_SERVICE_TOKEN in .env}
      PLAYER_MODE: http
      EXTERNAL_SERVICES_MODE: http
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - ./.local/stack/gateway-public.pem:/keys/gateway-public.pem:ro,z
      - ./.local/stack/broker-public.pem:/keys/broker-public.pem:ro,z
      - ./.local/stack/player-public.pem:/keys/player-public.pem:ro,z
    depends_on:
      session-db:
        condition: service_healthy
      player:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  moderation:
    deploy:
      replicas: 2
    image: ${MODERATION_IMAGE:-sentientmoss/pad-moderation-service:latest}
    env_file: .local/stack/moderation.env
    environment:
      <<: *registration
      SERVICE_NAME: moderation
      CONTROL_PLANE_NAME: moderation
      CONTROL_PLANE_TOKEN: ${MODERATION_CONTROL_TOKEN:?Set MODERATION_CONTROL_TOKEN in .env}
      DATABASE_URL: postgresql+psycopg://moderation:${MODERATION_DB_PASSWORD}@moderation-db:5432/moderation
      BROKER_URL: http://message-broker:8080
      BROKER_SERVICE_TOKEN: ${MODERATION_SERVICE_TOKEN:?Set MODERATION_SERVICE_TOKEN in .env}
    volumes:
      - ./.local/stack/gateway-public.pem:/keys/gateway-public.pem:ro,z
      - ./.local/stack/broker-public.pem:/keys/broker-public.pem:ro,z
      - moderation-publisher-logs:/var/log/student-id-publisher:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      moderation-db:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    restart: unless-stopped
  moderation-publisher:
    image: ${MODERATION_IMAGE:-sentientmoss/pad-moderation-service:latest}
    command: [python, -m, moderation.publisher]
    environment:
      DATABASE_URL: postgresql+psycopg://moderation:${MODERATION_DB_PASSWORD}@moderation-db:5432/moderation
      BROKER_URL: http://message-broker:8080
      BROKER_SERVICE_TOKEN: ${MODERATION_SERVICE_TOKEN:?Set MODERATION_SERVICE_TOKEN in .env}
    volumes:
      - moderation-publisher-logs:/var/log/student-id-publisher
    depends_on:
      moderation:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    restart: unless-stopped
  # Clients open the DMs WebSocket directly on a host port that each replica advertises.
  # Host ports cannot be shared by scaled replicas, so DMs runs as two explicit services.
  discord-dms-1: &discord-dms
    image: ${DISCORD_DMS_IMAGE:-sentientmoss/pad-discord-dms-service:latest}
    env_file: .local/stack/discord-dms.env
    environment: &discord-dms-environment
      <<: *registration
      SERVICE_NAME: discord-dms
      CONTROL_PLANE_NAME: discord-dms
      CONTROL_PLANE_TOKEN: ${DISCORD_DMS_CONTROL_TOKEN:?Set DISCORD_DMS_CONTROL_TOKEN in .env}
      DISCOVERY_LEASE_SECONDS: '15'
      GATEWAY_ALLOW_INSECURE_WS: 'true'
      GATEWAY_ALLOW_LOCAL_WS: 'true'
      INSTANCE_WS_URL: ws://localhost:${DMS_PORT:-8009}
      DATABASE_URL: postgresql+asyncpg://discord_dms:${DMS_DB_PASSWORD}@dms-db:5432/discord_dms
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CHAT_TICKET_SECRET: ${CHAT_TICKET_SECRET:?Set CHAT_TICKET_SECRET in .env}
      BROKER_URL: http://message-broker:8080
      BROKER_SERVICE_TOKEN: ${DISCORD_DMS_SERVICE_TOKEN:?Set DISCORD_DMS_SERVICE_TOKEN in .env}
    ports:
      - '127.0.0.1:${DMS_PORT:-8009}:8000'
    volumes:
      - ./.local/stack/gateway-public.pem:/keys/gateway-public.pem:ro,z
      - ./.local/stack/broker-public.pem:/keys/broker-public.pem:ro,z
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      dms-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    restart: unless-stopped
  discord-dms-2:
    <<: *discord-dms
    environment:
      <<: *discord-dms-environment
      INSTANCE_WS_URL: ws://localhost:${DMS_PORT_2:-8010}
    ports:
      - '127.0.0.1:${DMS_PORT_2:-8010}:8000'
  applicant:
    deploy:
      replicas: 2
    image: ${APPLICANT_IMAGE:-mcittkmims/applicant-service:latest}
    env_file: .local/stack/applicant.env
    environment:
      <<: *registration
      SERVICE_NAME: applicant
      CONTROL_PLANE_NAME: applicant
      CONTROL_PLANE_TOKEN: ${APPLICANT_CONTROL_TOKEN:?Set APPLICANT_CONTROL_TOKEN in .env}
      SERVER_ADDRESS: 0.0.0.0
      MONGODB_URI: mongodb://mongodb:27017/applicant?replicaSet=rs0&directConnection=true
      SESSION_URL: http://gateway:8083
      UNIVERSITY_URL: http://gateway:8083
    healthcheck:
      test: [CMD, bash, -c, 'exec 3<>/dev/tcp/127.0.0.1/8081 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
  credential:
    deploy:
      replicas: 2
    image: ${CREDENTIAL_IMAGE:-mcittkmims/credential-service:latest}
    env_file: .local/stack/credential.env
    environment:
      <<: *registration
      SERVICE_NAME: credential
      CONTROL_PLANE_NAME: credential
      CONTROL_PLANE_TOKEN: ${CREDENTIAL_CONTROL_TOKEN:?Set CREDENTIAL_CONTROL_TOKEN in .env}
      MONGODB_URI: mongodb://mongodb:27017/credential?replicaSet=rs0&directConnection=true
      SESSION_URL: http://gateway:8083
      UNIVERSITY_URL: http://gateway:8083
    healthcheck:
      test: [CMD, bash, -c, 'exec 3<>/dev/tcp/127.0.0.1/8082 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
  university-mongodb:
    image: mongo:7.0
    restart: unless-stopped
    entrypoint:
      - bash
      - -c
      - |
        keyfile=/data/configdb/replica-set.key
        if [ ! -f "$$keyfile" ]; then
          openssl rand -base64 756 > "$$keyfile"
          chown mongodb:mongodb "$$keyfile"
          chmod 400 "$$keyfile"
        fi
        exec /usr/local/bin/docker-entrypoint.sh "$$@"
      - --
    command: [mongod, --replSet, rs0, --keyFile, /data/configdb/replica-set.key, --bind_ip_all]
    environment:
      MONGO_INITDB_ROOT_USERNAME: university_record_service
      MONGO_INITDB_ROOT_PASSWORD: ${UNIVERSITY_MONGO_PASSWORD:?Set UNIVERSITY_MONGO_PASSWORD in .env}
    volumes:
      - university-mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1
          --username "$${MONGO_INITDB_ROOT_USERNAME}"
          --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin
          --eval 'try { quit(rs.status().ok === 1 ? 0 : 1) } catch (error) { quit(rs.initiate({_id:"rs0",members:[{_id:0,host:"university-mongodb:27017"}]}).ok === 1 ? 0 : 1) }'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  university-record:
    deploy:
      replicas: 2
    image: ${UNIVERSITY_RECORD_IMAGE:-maxnoragami/university-record-service:latest}
    env_file: .local/stack/university_record.env
    environment:
      <<: *registration
      SERVICE_NAME: university_record
      CONTROL_PLANE_NAME: university_record
      CONTROL_PLANE_TOKEN: ${UNIVERSITY_RECORD_CONTROL_TOKEN:?Set UNIVERSITY_RECORD_CONTROL_TOKEN in .env}
      SPRING_PROFILES_ACTIVE: gateway
      MONGO_HOST: university-mongodb
      MONGO_DATABASE: university_records
      MONGO_ROOT_USERNAME: university_record_service
      MONGO_ROOT_PASSWORD: ${UNIVERSITY_MONGO_PASSWORD:?Set UNIVERSITY_MONGO_PASSWORD in .env}
      SERVER_PORT: 8006
      TASK_TIMEOUT: ${JAVA_TASK_TIMEOUT:-30s}
      MAX_CONCURRENT_TASKS: ${HTTP_MAX_CONCURRENT_TASKS:-100}
    volumes:
      - ./.local/stack/gateway-public.pem:/keys/gateway-public.pem:ro,z
      - ./.local/stack/broker-public.pem:/keys/broker-public.pem:ro,z
    healthcheck:
      test: [CMD, bash, -c, 'exec 3<>/dev/tcp/127.0.0.1/8006 && printf "GET /healthz HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      university-mongodb:
        condition: service_healthy
    restart: unless-stopped
  rules-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: server_rules
      POSTGRES_USER: server_rules
      POSTGRES_PASSWORD: ${RULES_DB_PASSWORD:?Set RULES_DB_PASSWORD in .env}
    volumes:
      - rules-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  server-rules:
    deploy:
      replicas: 2
    image: ${SERVER_RULES_IMAGE:-maxnoragami/server-rules-service:latest}
    env_file: .local/stack/rules.env
    environment:
      <<: *registration
      SERVICE_NAME: rules
      CONTROL_PLANE_NAME: rules
      CONTROL_PLANE_TOKEN: ${SERVER_RULES_CONTROL_TOKEN:?Set SERVER_RULES_CONTROL_TOKEN in .env}
      SPRING_PROFILES_ACTIVE: gateway
      DATABASE_URL: jdbc:postgresql://rules-db:5432/server_rules
      POSTGRES_USER: server_rules
      POSTGRES_PASSWORD: ${RULES_DB_PASSWORD:?Set RULES_DB_PASSWORD in .env}
      SERVER_PORT: 8005
      CURSOR_SECRET: ${RULES_CURSOR_SECRET:?Set RULES_CURSOR_SECRET in .env}
      TASK_TIMEOUT: ${JAVA_TASK_TIMEOUT:-30s}
      MAX_CONCURRENT_TASKS: ${HTTP_MAX_CONCURRENT_TASKS:-100}
    volumes:
      - ./.local/stack/gateway-public.pem:/keys/gateway-public.pem:ro,z
      - ./.local/stack/broker-public.pem:/keys/broker-public.pem:ro,z
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- "http://127.0.0.1:$${SERVER_PORT}/healthz" >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      rules-db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  discovery-state:
  moderation-publisher-logs:
  player-data:
  session-data:
  moderation-data:
  dms-data:
  broker-db-data:
  mongo-data:
  university-mongo-data:
  rules-data:
