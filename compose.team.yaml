# Merge with compose.yaml after each owner supplies their published image and env file.
# Example: docker compose -f compose.yaml -f compose.team.yaml up -d --wait
services:
  applicant:
    image: ${APPLICANT_IMAGE:?Set the versioned Docker Hub image supplied by its owner}
    env_file: ./team-env/applicant.env
  credential:
    image: ${CREDENTIAL_IMAGE:?Set the versioned Docker Hub image supplied by its owner}
    env_file: ./team-env/credential.env
  rules:
    image: ${RULES_IMAGE:?Set the versioned Docker Hub image supplied by its owner}
    env_file: ./team-env/rules.env
  university-record:
    image: ${UNIVERSITY_RECORD_IMAGE:?Set the versioned Docker Hub image supplied by its owner}
    env_file: ./team-env/university-record.env
  moderation:
    image: ${MODERATION_IMAGE:?Set the versioned Docker Hub image supplied by its owner}
    env_file: ./team-env/moderation.env
  discord-dms:
    image: ${DISCORD_DMS_IMAGE:?Set the versioned Docker Hub image supplied by its owner}
    env_file: ./team-env/discord-dms.env
  session:
    environment:
      EXTERNAL_SERVICES_MODE: http
      APPLICANT_URL: http://applicant:${APPLICANT_PORT:?Set the applicant container port}
      CREDENTIAL_URL: http://credential:${CREDENTIAL_PORT:?Set the credential container port}
      RULES_URL: http://rules:${RULES_PORT:?Set the rules container port}
      UNIVERSITY_RECORD_URL: http://university-record:${UNIVERSITY_RECORD_PORT:?Set the records container port}
      SERVICE_TOKENS: ${TEAM_SESSION_SERVICE_TOKENS:?Supply the JSON map of allowed caller names to distinct tokens}
