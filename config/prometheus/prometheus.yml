global:
  scrape_interval: 5s
  scrape_timeout: 3s
  evaluation_interval: 5s
scrape_configs:
  - job_name: student-id
    http_sd_configs:
      - url: http://discovery:8081/sd/v1/targets
        refresh_interval: 5s
        http_headers:
          X-Control-Name:
            values: [prometheus]
          X-Control-Token:
            files: [/etc/prometheus/control-token]
