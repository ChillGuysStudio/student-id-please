name: student-id-please
x-registration: &registration
  DISCOVERY_URL: ${DISCOVERY_URL:-http://discovery-slot-1:8081}
  CONTROL_PLANE_TOKENS: '{"discovery":"${DISCOVERY_CONTROL_TOKEN:?Set DISCOVERY_CONTROL_TOKEN in .env}","operator":"${OPERATOR_CONTROL_TOKEN:?Set OPERATOR_CONTROL_TOKEN in .env}"}'
  CONTROL_MAX_CONCURRENT_CALLS: '8'
  DISCOVERY_REGISTER_INTERVAL_SECONDS: '5'
  OUTBOUND_TASK_TIMEOUT_SECONDS: '2'

services:
  gateway:
    image: ${GATEWAY_IMAGE:-maxnoragami/gateway-service:latest}
    pull_policy: always
    env_file: .local/stack/gateway.env
    environment:
      <<: *registration
      SERVICE_NAME: gateway
      INSTANCE_ID: ${GATEWAY_INSTANCE_ID:?Set GATEWAY_INSTANCE_ID in .env}
      INSTANCE_HTTP_URL: http://gateway-slot-1:8083
      CONTROL_PLANE_NAME: gateway
      CONTROL_PLANE_TOKEN: ${GATEWAY_CONTROL_TOKEN:?Set GATEWAY_CONTROL_TOKEN in .env}
    ports:
      - '127.0.0.1:${GATEWAY_PORT:-8080}:8080'
    volumes:
      - ./.local/stack/gateway-private.pem:/keys/gateway-private.pem:ro,z
      - ./.local/stack/player-public.pem:/keys/player-public.pem:ro,z
    healthcheck:
      test: [CMD, /gateway, --healthcheck]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      default:
        aliases: [gateway-slot-1]
    restart: unless-stopped
  discovery-state-init:
    # The Discovery image runs as 65532 and has no /state directory, so a fresh volume starts root-owned.
    image: busybox:1.37
    command: [chown, '65532:65532', /state]
    volumes:
      - discovery-state:/state
    restart: 'no'
  discovery:
    depends_on:
      discovery-state-init:
        condition: service_completed_successfully
    image: ${DISCOVERY_IMAGE:-maxnoragami/discovery-service:latest}
    pull_policy: always
    environment:
      SERVICE_NAME: discovery
      INSTANCE_ID: ${DISCOVERY_INSTANCE_ID:?Set DISCOVERY_INSTANCE_ID in .env}
      DISCOVERY_ADDR: ':8081'
      DISCOVERY_HEALTH_INTERVAL_SECONDS: '1'
      DISCOVERY_LEASE_SECONDS: '15'
      DISCOVERY_STATE_FILE: /state/removed.json
      CONTROL_PLANE_NAME: discovery
      CONTROL_PLANE_TOKEN: ${DISCOVERY_CONTROL_TOKEN:?Set DISCOVERY_CONTROL_TOKEN in .env}
      CONTROL_PLANE_TOKENS: '{"gateway":"${GATEWAY_CONTROL_TOKEN:?Set GATEWAY_CONTROL_TOKEN in .env}","player":"${PLAYER_CONTROL_TOKEN:?Set PLAYER_CONTROL_TOKEN in .env}","session":"${SESSION_CONTROL_TOKEN:?Set SESSION_CONTROL_TOKEN in .env}","moderation":"${MODERATION_CONTROL_TOKEN:?Set MODERATION_CONTROL_TOKEN in .env}","discord-dms":"${DISCORD_DMS_CONTROL_TOKEN:?Set DISCORD_DMS_CONTROL_TOKEN in .env}","applicant":"${APPLICANT_CONTROL_TOKEN:?Set APPLICANT_CONTROL_TOKEN in .env}","credential":"${CREDENTIAL_CONTROL_TOKEN:?Set CREDENTIAL_CONTROL_TOKEN in .env}","rules":"${SERVER_RULES_CONTROL_TOKEN:?Set SERVER_RULES_CONTROL_TOKEN in .env}","university_record":"${UNIVERSITY_RECORD_CONTROL_TOKEN:?Set UNIVERSITY_RECORD_CONTROL_TOKEN in .env}","discovery":"${DISCOVERY_CONTROL_TOKEN:?Set DISCOVERY_CONTROL_TOKEN in .env}","operator":"${OPERATOR_CONTROL_TOKEN:?Set OPERATOR_CONTROL_TOKEN in .env}"}'
      CONTROL_MAX_CONCURRENT_CALLS: '8'
      OUTBOUND_TASK_TIMEOUT_SECONDS: '2'
      GATEWAY_ALLOW_INSECURE_WS: 'true'
      GATEWAY_ALLOW_LOCAL_WS: 'true'
      DISCORD_WEBHOOK_URL: ${DISCOVERY_DISCORD_WEBHOOK_URL:-}
    volumes:
      - discovery-state:/state
    networks:
      default:
        aliases: [discovery-slot-1]
    healthcheck:
      test: [CMD, /discovery, --healthcheck]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
  player-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: player_db
      POSTGRES_USER: player
      POSTGRES_PASSWORD: ${PLAYER_DB_PASSWORD:?Set PLAYER_DB_PASSWORD in .env}
    volumes:
      - player-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U player -d player_db']
      interval: 5s
      timeout: 3s
      retries: 20
  session-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: session_db
      POSTGRES_USER: session
      POSTGRES_PASSWORD: ${SESSION_DB_PASSWORD:?Set SESSION_DB_PASSWORD in .env}
    volumes:
      - session-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U session -d session_db']
      interval: 5s
      timeout: 3s
      retries: 20
  moderation-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: moderation
      POSTGRES_USER: moderation
      POSTGRES_PASSWORD: ${MODERATION_DB_PASSWORD:?Set MODERATION_DB_PASSWORD in .env}
    volumes:
      - moderation-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U moderation -d moderation']
      interval: 5s
      timeout: 3s
      retries: 20
  dms-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: discord_dms
      POSTGRES_USER: discord_dms
      POSTGRES_PASSWORD: ${DMS_DB_PASSWORD:?Set DMS_DB_PASSWORD in .env}
    volumes:
      - dms-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U discord_dms -d discord_dms']
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    user: rabbitmq
    hostname: rabbitmq
    command: [sh, /run/start_broker.sh]
    environment:
      RABBITMQ_DEFAULT_USER: studentid
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      APPLICANT_BROKER_PASSWORD: ${APPLICANT_BROKER_PASSWORD:?Set APPLICANT_BROKER_PASSWORD in .env}
      CREDENTIAL_BROKER_PASSWORD: ${CREDENTIAL_BROKER_PASSWORD:?Set CREDENTIAL_BROKER_PASSWORD in .env}
      UNIVERSITY_BROKER_PASSWORD: ${UNIVERSITY_BROKER_PASSWORD:?Set UNIVERSITY_BROKER_PASSWORD in .env}
    volumes:
      - broker-data:/var/lib/rabbitmq
      - ./scripts/start_broker.sh:/run/start_broker.sh:ro,z
    healthcheck:
      test: [CMD-SHELL, 'test -f /tmp/broker-users-ready && rabbitmq-diagnostics -q ping']
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --requirepass, '${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: [CMD-SHELL, 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
  mongodb:
    # MongoDB 8.x refuses to start on Linux kernel 6.19+.
    image: mongo:7.0
    command: [mongod, --replSet, rs0, --bind_ip_all]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval '
          try { rs.status(); }
          catch (e) { if (e.codeName === "NotYetInitialized") { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongodb:27017"}]}); } else { throw e; } }
          if (!db.hello().isWritablePrimary) quit(1);'
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s
  player:
    image: ${PLAYER_IMAGE:-tirppy/student-id-player-service:latest}
    pull_policy: always
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, '8001', --log-config, /run/student-id/application-logging.json]
    env_file: .local/stack/player.env
    environment:
      <<: *registration
      SERVICE_NAME: player
      INSTANCE_ID: ${PLAYER_SLOT1_INSTANCE_ID:?Set PLAYER_SLOT1_INSTANCE_ID in .env}
      INSTANCE_HTTP_URL: http://player-slot-1:8001
      CONTROL_PLANE_NAME: player
      CONTROL_PLANE_TOKEN: ${PLAYER_CONTROL_TOKEN:?Set PLAYER_CONTROL_TOKEN in .env}
      DATABASE_URL: postgresql+psycopg://player:${PLAYER_DB_PASSWORD}@player-db:5432/player_db
      JWT_PRIVATE_KEY_PATH: /keys/player-private.pem
      RABBITMQ_URL: amqp://studentid:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    volumes:
      - ./.local/stack/player-private.pem:/keys/player-private.pem:ro,z
      - ./.local/stack/gateway-public.pem:/keys/gateway-public.pem:ro,z
      - ./config/python-application-logging.json:/run/student-id/application-logging.json:ro,z
    depends_on:
      player-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      default:
        aliases: [player-slot-1]
    restart: unless-stopped
  session:
    image: ${SESSION_IMAGE:-tirppy/student-id-session-service:latest}
    pull_policy: always
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, '8002', --log-config, /run/student-id/application-logging.json]
    env_file: .local/stack/session.env
    environment:
      <<: *registration
      SERVICE_NAME: session
      INSTANCE_ID: ${SESSION_SLOT1_INSTANCE_ID:?Set SESSION_SLOT1_INSTANCE_ID in .env}
      INSTANCE_HTTP_URL: http://session-slot-1:8002
      CONTROL_PLANE_NAME: session
      CONTROL_PLANE_TOKEN: ${SESSION_CONTROL_TOKEN:?Set SESSION_CONTROL_TOKEN in .env}
      DATABASE_URL: postgresql+psycopg://session:${SESSION_DB_PASSWORD}@session-db:5432/session_db
      GATEWAY_URL: http://gateway-slot-1:8083
      GATEWAY_SERVICE_TOKEN: ${SESSION_SERVICE_TOKEN:?Set SESSION_SERVICE_TOKEN in .env}
      PLAYER_MODE: http
      EXTERNAL_SERVICES_MODE: http
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      RABBITMQ_URL: amqp://studentid:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    volumes:
      - ./.local/stack/gateway-public.pem:/keys/gateway-public.pem:ro,z
      - ./.local/stack/player-public.pem:/keys/player-public.pem:ro,z
      - ./config/python-application-logging.json:/run/student-id/application-logging.json:ro,z
    depends_on:
      session-db:
        condition: service_healthy
      player:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      default:
        aliases: [session-slot-1]
    restart: unless-stopped
  moderation:
    image: ${MODERATION_IMAGE:-sentientmoss/pad-moderation-service:latest}
    pull_policy: always
    command: [uvicorn, moderation.api:app, --host, 0.0.0.0, --port, '8000', --log-config, /run/student-id/application-logging.json]
    env_file: .local/stack/moderation.env
    environment:
      <<: *registration
      SERVICE_NAME: moderation
      INSTANCE_ID: ${MODERATION_SLOT1_INSTANCE_ID:?Set MODERATION_SLOT1_INSTANCE_ID in .env}
      INSTANCE_HTTP_URL: http://moderation-slot-1:8000
      CONTROL_PLANE_NAME: moderation
      CONTROL_PLANE_TOKEN: ${MODERATION_CONTROL_TOKEN:?Set MODERATION_CONTROL_TOKEN in .env}
      GATEWAY_INTERNAL_URL: http://gateway-slot-1:8083
      DATABASE_URL: postgresql+psycopg://moderation:${MODERATION_DB_PASSWORD}@moderation-db:5432/moderation
      RABBITMQ_URL: amqp://studentid:${RABBITMQ_PASSWORD}@rabbitmq:5672/%2F
      SESSION_URL: http://gateway-slot-1:8083
      SESSION_SERVICE_TOKEN: ${MODERATION_SERVICE_TOKEN}
      APPLICANT_URL: http://gateway-slot-1:8083
      APPLICANT_SERVICE_TOKEN: ${MODERATION_SERVICE_TOKEN}
      CREDENTIAL_URL: http://gateway-slot-1:8083
      CREDENTIAL_SERVICE_TOKEN: ${MODERATION_SERVICE_TOKEN}
      UNIVERSITY_URL: http://gateway-slot-1:8083
      UNIVERSITY_SERVICE_TOKEN: ${MODERATION_SERVICE_TOKEN}
      RULES_URL: http://gateway-slot-1:8083
      RULES_SERVICE_TOKEN: ${MODERATION_SERVICE_TOKEN}
      PLAYER_URL: http://gateway-slot-1:8083
      PLAYER_SERVICE_TOKEN: ${MODERATION_SERVICE_TOKEN}
    volumes:
      - ./.local/stack/gateway-public.pem:/keys/gateway-public.pem:ro,z
      - ./config/python-application-logging.json:/run/student-id/application-logging.json:ro,z
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      moderation-db:
        condition: service_healthy
      gateway:
        condition: service_healthy
    networks:
      default:
        aliases: [moderation-slot-1]
    restart: unless-stopped
  moderation-publisher:
    image: ${MODERATION_IMAGE:-sentientmoss/pad-moderation-service:latest}
    pull_policy: always
    command: [python, -m, moderation.publisher]
    environment:
      DATABASE_URL: postgresql+psycopg://moderation:${MODERATION_DB_PASSWORD}@moderation-db:5432/moderation
      RABBITMQ_URL: amqp://studentid:${RABBITMQ_PASSWORD}@rabbitmq:5672/%2F
    depends_on:
      moderation:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
  discord-dms:
    image: ${DISCORD_DMS_IMAGE:-sentientmoss/pad-discord-dms-service:latest}
    pull_policy: always
    command: [uvicorn, discord_dms.api:app, --host, 0.0.0.0, --port, '8000', --no-access-log, --ws-ping-interval, '30', --ws-ping-timeout, '60', --log-config, /run/student-id/application-logging.json]
    env_file: .local/stack/discord-dms.env
    environment:
      <<: *registration
      SERVICE_NAME: discord-dms
      INSTANCE_ID: ${DISCORD_DMS_SLOT1_INSTANCE_ID:?Set DISCORD_DMS_SLOT1_INSTANCE_ID in .env}
      INSTANCE_HTTP_URL: http://discord-dms-slot-1:8000
      CONTROL_PLANE_NAME: discord-dms
      CONTROL_PLANE_TOKEN: ${DISCORD_DMS_CONTROL_TOKEN:?Set DISCORD_DMS_CONTROL_TOKEN in .env}
      DISCOVERY_LEASE_SECONDS: '15'
      GATEWAY_ALLOW_INSECURE_WS: 'true'
      GATEWAY_ALLOW_LOCAL_WS: 'true'
      INSTANCE_WS_URL: ws://localhost:${DMS_PORT:-8009}
      DATABASE_URL: postgresql+asyncpg://discord_dms:${DMS_DB_PASSWORD}@dms-db:5432/discord_dms
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CHAT_TICKET_SECRET: ${CHAT_TICKET_SECRET:?Set CHAT_TICKET_SECRET in .env}
      SESSION_URL: http://gateway-slot-1:8083
      SESSION_SERVICE_TOKEN: ${DISCORD_DMS_SERVICE_TOKEN}
      UNIVERSITY_URL: http://gateway-slot-1:8083
      UNIVERSITY_SERVICE_TOKEN: ${DISCORD_DMS_SERVICE_TOKEN}
    ports:
      - '127.0.0.1:${DMS_PORT:-8009}:8000'
    volumes:
      - ./.local/stack/gateway-public.pem:/keys/gateway-public.pem:ro,z
      - ./config/python-application-logging.json:/run/student-id/application-logging.json:ro,z
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      dms-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      gateway:
        condition: service_healthy
    networks:
      default:
        aliases: [discord-dms-slot-1]
    restart: unless-stopped
  applicant:
    image: ${APPLICANT_IMAGE:-mcittkmims/applicant-service:latest}
    pull_policy: always
    env_file: .local/stack/applicant.env
    environment:
      <<: *registration
      SERVICE_NAME: applicant
      INSTANCE_ID: ${APPLICANT_SLOT1_INSTANCE_ID:?Set APPLICANT_SLOT1_INSTANCE_ID in .env}
      INSTANCE_HTTP_URL: http://applicant-slot-1:8081
      CONTROL_PLANE_NAME: applicant
      CONTROL_PLANE_TOKEN: ${APPLICANT_CONTROL_TOKEN:?Set APPLICANT_CONTROL_TOKEN in .env}
      GATEWAY_INTERNAL_URL: http://gateway-slot-1:8083
      SERVER_ADDRESS: 0.0.0.0
      MONGODB_URI: mongodb://mongodb:27017/applicant?replicaSet=rs0&directConnection=true
      SESSION_URL: http://gateway-slot-1:8083
      UNIVERSITY_URL: http://gateway-slot-1:8083
      RABBITMQ_URL: amqp://applicant:${APPLICANT_BROKER_PASSWORD}@rabbitmq:5672/
      BROKER_PRODUCERS: '{"applicant":"applicant","credential":"credential","university_record":"university_record"}'
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      default:
        aliases: [applicant-slot-1]
    restart: unless-stopped
  credential:
    image: ${CREDENTIAL_IMAGE:-mcittkmims/credential-service:latest}
    pull_policy: always
    env_file: .local/stack/credential.env
    environment:
      <<: *registration
      SERVICE_NAME: credential
      INSTANCE_ID: ${CREDENTIAL_SLOT1_INSTANCE_ID:?Set CREDENTIAL_SLOT1_INSTANCE_ID in .env}
      INSTANCE_HTTP_URL: http://credential-slot-1:8082
      CONTROL_PLANE_NAME: credential
      CONTROL_PLANE_TOKEN: ${CREDENTIAL_CONTROL_TOKEN:?Set CREDENTIAL_CONTROL_TOKEN in .env}
      GATEWAY_INTERNAL_URL: http://gateway-slot-1:8083
      MONGODB_URI: mongodb://mongodb:27017/credential?replicaSet=rs0&directConnection=true
      SESSION_URL: http://gateway-slot-1:8083
      UNIVERSITY_URL: http://gateway-slot-1:8083
      RABBITMQ_URL: amqp://credential:${CREDENTIAL_BROKER_PASSWORD}@rabbitmq:5672/
      BROKER_PRODUCERS: '{"applicant":"applicant","credential":"credential","university_record":"university_record"}'
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      default:
        aliases: [credential-slot-1]
    restart: unless-stopped
  university-mongodb:
    image: mongo:7.0
    restart: unless-stopped
    entrypoint:
      - bash
      - -c
      - |
        keyfile=/data/configdb/replica-set.key
        if [ ! -f "$$keyfile" ]; then
          openssl rand -base64 756 > "$$keyfile"
          chown mongodb:mongodb "$$keyfile"
          chmod 400 "$$keyfile"
        fi
        exec /usr/local/bin/docker-entrypoint.sh "$$@"
      - --
    command: [mongod, --replSet, rs0, --keyFile, /data/configdb/replica-set.key, --bind_ip_all]
    environment:
      MONGO_INITDB_ROOT_USERNAME: university_record_service
      MONGO_INITDB_ROOT_PASSWORD: ${UNIVERSITY_MONGO_PASSWORD:?Set UNIVERSITY_MONGO_PASSWORD in .env}
    volumes:
      - university-mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1
          --username "$${MONGO_INITDB_ROOT_USERNAME}"
          --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin
          --eval 'try { quit(rs.status().ok === 1 ? 0 : 1) } catch (error) { quit(rs.initiate({_id:"rs0",members:[{_id:0,host:"university-mongodb:27017"}]}).ok === 1 ? 0 : 1) }'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  university-record:
    image: ${UNIVERSITY_RECORD_IMAGE:-maxnoragami/university-record-service:latest}
    pull_policy: always
    env_file: .local/stack/university_record.env
    environment:
      <<: *registration
      SERVICE_NAME: university_record
      INSTANCE_ID: ${UNIVERSITY_RECORD_SLOT1_INSTANCE_ID:?Set UNIVERSITY_RECORD_SLOT1_INSTANCE_ID in .env}
      INSTANCE_HTTP_URL: http://university-record-slot-1:8006
      CONTROL_PLANE_NAME: university_record
      CONTROL_PLANE_TOKEN: ${UNIVERSITY_RECORD_CONTROL_TOKEN:?Set UNIVERSITY_RECORD_CONTROL_TOKEN in .env}
      GATEWAY_INTERNAL_URL: http://gateway-slot-1:8083
      SPRING_PROFILES_ACTIVE: gateway
      MONGO_HOST: university-mongodb
      MONGO_DATABASE: university_records
      MONGO_ROOT_USERNAME: university_record_service
      MONGO_ROOT_PASSWORD: ${UNIVERSITY_MONGO_PASSWORD:?Set UNIVERSITY_MONGO_PASSWORD in .env}
      RABBITMQ_URL: amqp://university_record:${UNIVERSITY_BROKER_PASSWORD}@rabbitmq:5672/%2F
      SERVER_PORT: 8006
      TASK_TIMEOUT: ${JAVA_TASK_TIMEOUT:-30s}
      MAX_CONCURRENT_TASKS: ${HTTP_MAX_CONCURRENT_TASKS:-100}
    volumes:
      - ./.local/stack/gateway-public.pem:/keys/gateway-public.pem:ro,z
    depends_on:
      university-mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      default:
        aliases: [university-record-slot-1]
    restart: unless-stopped
  rules-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: server_rules
      POSTGRES_USER: server_rules
      POSTGRES_PASSWORD: ${RULES_DB_PASSWORD:?Set RULES_DB_PASSWORD in .env}
    volumes:
      - rules-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  server-rules:
    image: ${SERVER_RULES_IMAGE:-maxnoragami/server-rules-service:latest}
    pull_policy: always
    env_file: .local/stack/rules.env
    environment:
      <<: *registration
      SERVICE_NAME: rules
      INSTANCE_ID: ${SERVER_RULES_SLOT1_INSTANCE_ID:?Set SERVER_RULES_SLOT1_INSTANCE_ID in .env}
      INSTANCE_HTTP_URL: http://server-rules-slot-1:8005
      CONTROL_PLANE_NAME: rules
      CONTROL_PLANE_TOKEN: ${SERVER_RULES_CONTROL_TOKEN:?Set SERVER_RULES_CONTROL_TOKEN in .env}
      GATEWAY_INTERNAL_URL: http://gateway-slot-1:8083
      INTERNAL_GATEWAY_URL: http://gateway-slot-1:8083
      SPRING_PROFILES_ACTIVE: gateway
      DATABASE_URL: jdbc:postgresql://rules-db:5432/server_rules
      POSTGRES_USER: server_rules
      POSTGRES_PASSWORD: ${RULES_DB_PASSWORD:?Set RULES_DB_PASSWORD in .env}
      SERVER_PORT: 8005
      CURSOR_SECRET: ${RULES_CURSOR_SECRET:?Set RULES_CURSOR_SECRET in .env}
      TASK_TIMEOUT: ${JAVA_TASK_TIMEOUT:-30s}
      MAX_CONCURRENT_TASKS: ${HTTP_MAX_CONCURRENT_TASKS:-100}
    volumes:
      - ./.local/stack/gateway-public.pem:/keys/gateway-public.pem:ro,z
    depends_on:
