syntax = "proto3";

// Control operations that every process serves on its gRPC listener.
package student_id.control.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/ChillGuysStudio/student-id-please/gen/go/student_id/control/v1;controlv1";
option java_multiple_files = true;
option java_outer_classname = "ControlProto";
option java_package = "com.chillguysstudio.studentid.control.v1";

// ControlService replaces GET /internal/v1/status and GET /internal/v1/logs.
// Callers authenticate with x-control-name and x-control-token metadata.
service ControlService {
  // Status snapshot. Callers: discovery, operator. Discovery's own status
  // also accepts every authenticated control caller.
  rpc GetStatus(GetStatusRequest) returns (Status);
  // Bounded export of this process's retained log records. Callers: gateway,
  // operator.
  rpc ExportLogs(ExportLogsRequest) returns (stream ExportLogsResponse);
}

message GetStatusRequest {}

// Status mirrors the Status object of the resilience contract.
message Status {
  string service_name = 1;
  string instance_id = 2;
  string boot_id = 3;
  bool live = 4;
  bool ready = 5;
  optional string reason = 6;
  Load load = 7;
}

message Load {
  int32 active_tasks = 1;
  int32 max_concurrent_tasks = 2;
  double utilization = 3;
  bool critical = 4;
}

message ExportLogsRequest {
  // Unset means 15 minutes before until.
  google.protobuf.Timestamp since = 1;
  // Unset means now.
  google.protobuf.Timestamp until = 2;
  // Unset means 1048576. Valid range 1 to 4194304.
  optional int32 max_bytes = 3;
  // Moderation only: "publisher" exports the Moderation publisher's records.
  optional string process = 4;
}

// The stream sends zero or more records messages, then exactly one summary
// as its last message.
message ExportLogsResponse {
  oneof item {
    // One or more complete NDJSON records, each ending with a newline.
    bytes records = 1;
    ExportSummary summary = 2;
  }
}

message ExportSummary {
  bool truncated = 1;
  int32 records = 2;
  int32 skipped = 3;
}
